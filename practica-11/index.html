<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <title>
        Deportiva ITSON · Componentes
    </title>

    <link rel="stylesheet" href="/src/estilos.css">
</head>

<body>

    <!-- Encabezado con el logo y el contador del carrito -->
    <header class="encabezado">

        <div class="encabezado__marca">
            <img src="/img/logo.svg" alt="" height="34">

            <span>ITSON</span>
        </div>

        <div class="encabezado__carrito">

            <span>
                Carrito:
                <strong id="cuenta">
                    0
                </strong>
            </span>

            <!-- Uso del componente reutilizable -->
            <boton-app id="vaciar" variante="peligro">
                Vaciar
            </boton-app>

        </div>
    </header>

    <main class="contenido">

        <section class="portada">
            <h1>
                Catálogo de temporada
            </h1>

            <p>
                Doce productos. Una sola tarjeta escrita una vez.
            </p>
        </section>

        <!-- Aquí main.ts coloca las tarjetas -->
        <section class="rejilla" id="rejilla">
        </section>

        <!-- Aquí main.ts muestra lo que hay en el carrito -->
        <section class="tarea">
            <h2>
                Carrito
            </h2>

            <tabla-generica id="tabla-carrito"></tabla-generica>
        </section>

        <!-- Esta sección sirve para probar las variantes -->
        <section class="tarea" id="tarea">

            <h2>
                Variantes del botón
            </h2>

            <div class="variantes-botones">

                <boton-app variante="primario">
                    Primario
                </boton-app>

                <boton-app variante="secundario">
                    Secundario
                </boton-app>

                <boton-app variante="peligro">
                    Peligro
                </boton-app>

                <boton-app variante="primario" deshabilitado>
                    Deshabilitado
                </boton-app>

            </div>
        </section>

        <!-- Esta sección sirve para probar los estados de la insignia -->
        <section class="tarea">

            <h2>
                Estados de la insignia
            </h2>

            <div class="variantes-botones">

                <insignia-estado estado="disponible"></insignia-estado>

                <insignia-estado estado="pocas-piezas"></insignia-estado>

                <insignia-estado estado="agotado"></insignia-estado>

            </div>
        </section>

    </main>

    <!-- Punto de entrada de TypeScript -->
    <script type="module" src="/src/main.ts">
    </script>

</body>

</html>
